// ====================================================================
// Team Fortress 2 Server Configuration
// Vanilla+ Quickplay Style Settings
// ====================================================================

// ====================================================================
// Server Basic Settings
// ====================================================================
hostname "My TF2 Server"              // Server name
rcon_password "change_this_password"  // RCON password (CHANGE THIS!)
sv_password ""                        // Server password (empty = no password)

// Network settings
sv_region 255                         // 255 = World (change to your region)
sv_lan 0                              // 0 = Internet, 1 = LAN only
sv_allow_wait_command 1               // Allow +wait command

// ====================================================================
// Gameplay Settings - Vanilla+ Configuration
// ====================================================================

// Player limits
sv_maxplayers 32                      // Maximum number of players (12, 16, 24, 32)
mp_maxrounds 0                        // Max rounds before mapchange (0 = unlimited)

// Gameplay mechanics
mp_allowspectators 1                  // Allow spectators
mp_friendlyfire 0                     // No friendly fire
mp_autoteambalance 1                  // Auto balance teams
mp_teams_unbalance_limit 1            // Difference between teams allowed
mp_tournament_allow_teamchange 1      // Allow team switching (Quickplay style)

// Damage and health
mp_damage_scale 1.0                   // Damage scale multiplier
sv_thirdperson 0                      // No third-person view
sv_alltalk 0                          // Disable all-talk (team chat only)

// ====================================================================
// Map Settings - Old Timer Configuration
// ====================================================================

// Round/map timing
mp_timelimit 30                       // Time limit in minutes (Quickplay style)
mp_roundtime 9                        // Time per round
mp_timelimit_surprise 10              // Surprise sudden death timer

// Capture Point / Objective Settings
mp_capdetroit_point_resetdelay 30     // Point capture reset delay
sv_use_query_port 1                   // Enable query port for server listing

// ====================================================================
// Team Configuration
// ====================================================================

// Spectator settings
mp_spectators_max 0                   // Max spectators (0 = unlimited)

// Waiting for players
mp_waitingforplayers_time 0           // Waiting for players state (0 = disabled)
mp_show_classlimit_messages 1         // Show class limit messages

// ====================================================================
// Logging and Admin
// ====================================================================

log on                                // Enable server logging
sv_logfile "tf2_server.log"          // Log file name
sv_logsdir "logs"                     // Log directory
sv_logonlydeaths 0                    // Log only deaths or all events
sv_logecho 1                          // Echo log to console

// Gameplay logging
mp_logdetail 3                        // Log detail level (3 = high detail)
mp_tournament_stopwatch 0             // Tournament stopwatch (usually off)

// ====================================================================
// Performance and Stability
// ====================================================================

sv_accelerate 5                       // Player acceleration
sv_friction 4                         // Friction multiplier
sv_gravity 800                        // Gravity setting
sv_maxspeed 320                       // Max player speed

// CPU performance
fps_max 66                            // Server FPS cap
sv_minrate 0                          // Minimum player rate
sv_maxrate 0                          // Maximum player rate
sv_client_min_interp_ratio -1         // Client interpolation
sv_client_max_interp_ratio 2          // Client interpolation

// ====================================================================
// Backups and Reporting
// ====================================================================

sv_crash_on_nan 0                     // Crash on NaN errors
sv_deadtalk 0                         // Dead players can only talk to team

// ====================================================================
// Map Cycle - Common Vanilla Maps
// ====================================================================
// Edit this file: server_files/tf/cfg/mapcycle.txt
// Some popular vanilla maps:
// cp_dustbowl
// cp_gravelpit
// cp_well
// ctf_2fort
// pl_badwater
// pl_upward
// pl_goldrush

// ====================================================================
// ADDITIONAL COMMANDS
// ====================================================================
// Uncomment these to enable specific features:

// Enable HLTV (spectator relay - requires separate setup)
// tv_enable 1
// tv_port 27020
// tv_maxclients 128
// tv_name "HLTV"

// Enable STV demo recording (for demos/replays)
// tv_autorecord 1

// Vote settings
// mp_allowvote 1
// mp_vote_counts_machine_votes 0

// ====================================================================
// DO NOT MODIFY BELOW THIS LINE
// ====================================================================
